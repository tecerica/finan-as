<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle Financeiro</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 0;
    }

    header {
        background: #2ecc71;
        color: white;
        padding: 15px;
        text-align: center;
    }

    .container {
        padding: 20px;
        max-width: 800px;
        margin: auto;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        margin-bottom: 20px;
    }

    input, select, button {
        padding: 10px;
        margin: 5px 0;
        width: 100%;
        border-radius: 5px;
        border: 1px solid #ccc;
    }

    button {
        background: #2ecc71;
        color: white;
        border: none;
        cursor: pointer;
    }

    button:hover {
        background: #27ae60;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 10px;
    }

    th, td {
        padding: 10px;
        text-align: left;
        border-bottom: 1px solid #ddd;
    }

    .entrada {
        color: green;
    }

    .saida {
        color: red;
    }
</style>
</head>

<body>

<header>
    <h1>💰 Controle Financeiro</h1>
</header>

<div class="container">

    <div class="card">
        <h2>Adicionar Transação</h2>

        <input type="text" id="descricao" placeholder="Descrição">

        <input type="number" id="valor" placeholder="Valor">

        <select id="tipo">
            <option value="entrada">Entrada</option>
            <option value="saida">Saída</option>
        </select>

        <button onclick="adicionarTransacao()">Adicionar</button>
    </div>

    <div class="card">
        <h2>Resumo</h2>
        <p><strong>Entradas:</strong> R$ <span id="totalEntrada">0.00</span></p>
        <p><strong>Saídas:</strong> R$ <span id="totalSaida">0.00</span></p>
        <p><strong>Saldo:</strong> R$ <span id="saldo">0.00</span></p>
    </div>

    <div class="card">
        <h2>Histórico</h2>
        <table>
            <thead>
                <tr>
                    <th>Descrição</th>
                    <th>Valor</th>
                    <th>Tipo</th>
                </tr>
            </thead>
            <tbody id="tabela"></tbody>
        </table>
    </div>

</div>

<script>
let entradas = 0;
let saidas = 0;

function adicionarTransacao() {
    const descricao = document.getElementById("descricao").value;
    const valor = parseFloat(document.getElementById("valor").value);
    const tipo = document.getElementById("tipo").value;

    if (!descricao || isNaN(valor)) {
        alert("Preencha os campos corretamente!");
        return;
    }

    const tabela = document.getElementById("tabela");
    const linha = tabela.insertRow();

    linha.insertCell(0).innerText = descricao;
    linha.insertCell(1).innerText = "R$ " + valor.toFixed(2);
    linha.insertCell(2).innerText = tipo;

    linha.classList.add(tipo);

    if (tipo === "entrada") {
        entradas += valor;
    } else {
        saidas += valor;
    }

    atualizarResumo();

    document.getElementById("descricao").value = "";
    document.getElementById("valor").value = "";
}

function atualizarResumo() {
    document.getElementById("totalEntrada").innerText = entradas.toFixed(2);
    document.getElementById("totalSaida").innerText = saidas.toFixed(2);
    document.getElementById("saldo").innerText = (entradas - saidas).toFixed(2);
}
</script>

</body>
</html>
